name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Generate Gradle project
        run: |
          mkdir -p app/src/main/java/com/example/groqchat

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GroqChat"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.groqchat'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.groqchat'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
                  buildConfigField "String", "GROQ_API_KEY", "\"" + (System.getenv("GROQ_API_KEY") ?: "") + "\""
              }

              buildFeatures {
                  buildConfig true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="Groq AI"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/groqchat/MainActivity.kt <<'EOF'
          package com.example.groqchat

          import android.app.Activity
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : Activity() {

              private val history = JSONArray()
              private lateinit var chat: TextView
              private lateinit var scroll: ScrollView
              private lateinit var input: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 64, 24, 24)
                  }
                  scroll = ScrollView(this)
                  chat = TextView(this).apply {
                      textSize = 16f
                      setTextIsSelectable(true)
                  }
                  scroll.addView(chat)
                  root.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f))

                  val row = LinearLayout(this)
                  input = EditText(this).apply { hint = "Сообщение" }
                  val sendBtn = Button(this).apply {
                      text = "Отправить"
                      setOnClickListener { send() }
                  }
                  row.addView(input, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(sendBtn)
                  root.addView(row)
                  setContentView(root)

                  history.put(
                      JSONObject()
                          .put("role", "system")
                          .put("content", "Ты полезный ИИ-ассистент. Отвечай на языке пользователя.")
                  )
              }

              private fun append(s: String) {
                  chat.append(s)
                  scroll.post { scroll.fullScroll(ScrollView.FOCUS_DOWN) }
              }

              private fun send() {
                  val text = input.text.toString().trim()
                  if (text.isEmpty()) return
                  input.setText("")
                  append("Вы: " + text + "\n\n")
                  history.put(JSONObject().put("role", "user").put("content", text))
                  Thread {
                      val reply = try {
                          ask()
                      } catch (e: Exception) {
                          history.remove(history.length() - 1)
                          "Ошибка: " + e.message
                      }
                      runOnUiThread { append("ИИ: " + reply + "\n\n") }
                  }.start()
              }

              private fun ask(): String {
                  val body = JSONObject()
                      .put("model", "llama-3.3-70b-versatile")
                      .put("messages", history)
                  val c = URL("https://api.groq.com/openai/v1/chat/completions")
                      .openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 20000
                  c.readTimeout = 60000
                  c.setRequestProperty("Authorization", "Bearer " + BuildConfig.GROQ_API_KEY)
                  c.setRequestProperty("Content-Type", "application/json")
                  c.doOutput = true
                  c.outputStream.use { it.write(body.toString().toByteArray()) }

                  val code = c.responseCode
                  val stream = if (code < 400) c.inputStream else c.errorStream
                  val resp = stream.bufferedReader().use { it.readText() }
                  if (code >= 400) throw Exception("HTTP " + code + ": " + resp)

                  val msg = JSONObject(resp)
                      .getJSONArray("choices")
                      .getJSONObject(0)
                      .getJSONObject("message")
                      .getString("content")
                  history.put(JSONObject().put("role", "assistant").put("content", msg))
                  return msg
              }
          }
          EOF

      - name: Generate app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os

          S = 512
          img = Image.new("RGBA", (S, S))
          d = ImageDraw.Draw(img)
          for y in range(S):
              t = y / S
              d.line([(0, y), (S, y)], fill=(int(124 - 60 * t), int(58 + 40 * t), int(237 - 20 * t), 255))
          d.rounded_rectangle((96, 120, 416, 340), radius=60, fill="white")
          d.polygon([(170, 330), (170, 420), (250, 335)], fill="white")
          for x in (190, 256, 322):
              d.ellipse((x - 18, 210, x + 18, 246), fill=(124, 58, 237, 255))

          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for name, px in sizes.items():
              folder = "app/src/main/res/mipmap-" + name
              os.makedirs(folder, exist_ok=True)
              img.resize((px, px), Image.LANCZOS).save(folder + "/ic_launcher.png")
          PY

      - name: Build debug APK
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GroqChat-apk
          path: app/build/outputs/apk/debug/app-debug.apk
